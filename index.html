<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>xNovel - Novel Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <header>
        <div class="title-group">
            <h1 class="app-title">
                <img src="xNovel.ico" alt="xVoice Icon" class="title-icon">
                xNovel -小説家になろうダウンローダー- 
            </h1>
            <div class="ver-title">Ver1.01.0</div>
        </div>
        <div class="theme-switch">
            <button id="themeToggle" type="button" aria-label="テーマ切り替え">☀️</button>
        </div>
    </header>

    <main>
        <section class="search-bar">
            <input type="text" id="ncodeInput" placeholder="Nコードを入力 (例: n9669b)">
            <div id="statusDisplay" class="status-display"></div>
            <div id="titleDisplay" class="title-display"></div>
            <button id="searchBtn">🔎</button>
            <button id="saveBtn" disabled>💾</button>
        </section>
        <div id="progressContainer" class="progress-container hidden">
            <progress id="progressBar" value="0" max="100"></progress>
        </div>
        <section class="content-container">
            <aside class="sidebar">
                <h3>リスト</h3>
                <ul id="textList"></ul>
            </aside>
            <section class="viewer">
                <textarea id="textViewer" readonly placeholder="リストから項目を選択するとここに表示されます。"></textarea>
            </section>
        </section>

        <div id="statusMessage" class="status-message"></div>
    </main>

    <!-- copyright＆email -->
    <div class="copyright-container">
        <span class="email-text" id="email-text">x-builder@gmail.com</span>
        <span class="copyright-text" id="copyright-text">Copyright © 2026- @x-builder, Japan</span>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
